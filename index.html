<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 30% 20%,#2a4a7a 0%,#16233a 55%,#0d1522 100%);
  color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;
  font:15px/1.5 "Malgun Gothic","Microsoft YaHei","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
.card{
  width:min(94vw,380px);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  border-radius:18px;padding:30px 26px 24px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(6px);
}
.lock{font-size:34px;line-height:1;margin-bottom:12px;opacity:.95}
.t1{font-size:21px;font-weight:700;letter-spacing:.4px}
.t2{font-size:12.5px;opacity:.72;margin-top:4px}
form{margin-top:22px}
input{
  width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);color:#fff;font-size:16px;letter-spacing:1px;
  text-align:center;outline:none;
}
input::placeholder{color:rgba(255,255,255,.45);letter-spacing:0}
input:focus{border-color:#7fb0ff;box-shadow:0 0 0 3px rgba(127,176,255,.18)}
button{
  width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;cursor:pointer;
  background:#3d76c9;color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px;
}
button:hover{background:#4c86db}
button:active{transform:translateY(1px)}
.err{display:none;margin-top:12px;font-size:13px;color:#ffb4a2}
.hint{margin-top:18px;font-size:11.5px;line-height:1.6;opacity:.55}
.busy{opacity:.6;pointer-events:none}
</style>
</head>

<script>
(function(){
  var meta = JSON.parse(document.getElementById('meta').textContent);
  var payload = document.getElementById('payload').textContent.trim();
  var err = document.getElementById('err');
  var card = document.getElementById('card');
  function u8(b64){ var bin = atob(b64), a = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  async function open(code){
    if(!code) return false;
    card.classList.add('busy');
    try{
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim()), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(meta.salt), iterations:meta.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(meta.iv)}, key, u8(payload));
      var html = new TextDecoder('utf-8').decode(plain);
      try{ sessionStorage.setItem('jks_code', code.trim()); }catch(e){}
      document.open(); document.write(html); document.close();
      return true;
    }catch(e){
      card.classList.remove('busy');
      return false;
    }
  }
  function hashCode(){
    var h = location.hash.replace(/^#/, '');
    try{ h = decodeURIComponent(h); }catch(e){}
    if(!h || h.charAt(0) === '/') return '';
    return h;
  }
  async function boot(){
    var c = hashCode();
    if(!c){ try{ c = sessionStorage.getItem('jks_code') || ''; }catch(e){ c = ''; } }
    if(c && await open(c)) return;
    if(hashCode()) err.style.display = 'block';
    document.getElementById('code').focus();
  }
  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    err.style.display = 'none';
    var v = document.getElementById('code').value;
    if(!(await open(v))){ err.style.display = 'block'; card.classList.remove('busy'); }
  });
  boot();
})();
</script>
